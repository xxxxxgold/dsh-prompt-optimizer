<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-prompt-optimizer — ♂harden button</title>
<style>
  html,body{margin:0;padding:0}
  body{padding:26px 28px;display:flex;flex-direction:column;gap:20px;
       font-family:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  .band{padding:22px 26px;border-radius:14px;display:flex;flex-wrap:wrap;gap:34px;align-items:center}
  .band.light{background:#f6f7f9;color:#1c1d21}
  .band.dark{background:#17181c;color:#e8e9ec}
  .cell{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .cap{font-size:11px;letter-spacing:.7px;text-transform:uppercase;opacity:.5}
  .head{font-size:13px;opacity:.65;margin:0 0 -6px 2px}
  .band.menu{align-items:flex-start;padding:96px 26px 18px}
  #dsh-po-probe{display:none}
</style>
</head>
<body>
  <div class="head">dsh-prompt-optimizer — real component, real stylesheet, four phases</div>
  <div class="band light" id="light"></div>
  <div class="band dark" id="dark"></div>
  <div class="band menu dark" id="menu-dark"></div>

<script>
/* Capture the module the way the shell does. */
var captured = null;
window.__ModuleLoader__ = { load: function (mod) { captured = mod; } };
</script>
<script src="../client.js"></script>
<script>
(function () {
  /* A stub React with just enough hook surface for one static render. */
  /* A static render cannot fire events, so `statePlan` seeds the hook order
     (phase, note, picking, style, preset, efforts, effort, models, selection,
     lock, effortSource) for the cell currently being built. */
  var statePlan = null;
  var stateCursor = 0;
  var React = {
    useState: function (initial) {
      if (statePlan !== null && stateCursor < statePlan.length) {
        var seeded = statePlan[stateCursor];
        stateCursor += 1;
        return [seeded, function () {}];
      }
      var resolved = typeof initial === 'function' ? initial() : initial;
      return [resolved, function () {}];
    },
    useEffect: function () {},
    useRef: function (initial) { return { current: initial }; },
    useCallback: function (fn) { return fn; },
    createElement: function (type, props) {
      var rest = Array.prototype.slice.call(arguments, 2);
      var merged = Object.assign({}, props);
      if (rest.length === 1) merged.children = rest[0];
      else if (rest.length > 1) merged.children = rest;
      return { type: type, props: merged };
    },
  };
  var jsxRuntime = {
    jsx: function (type, props) { return { type: type, props: props || {} }; },
    jsxs: function (type, props) { return { type: type, props: props || {} }; },
    Fragment: 'Fragment',
  };

  /* Materialize an element tree into real DOM. */
  function mount(node) {
    if (node === null || node === undefined || typeof node === 'boolean') return null;
    if (typeof node === 'string' || typeof node === 'number') return document.createTextNode(String(node));
    if (Array.isArray(node)) {
      var frag = document.createDocumentFragment();
      node.forEach(function (child) { var made = mount(child); if (made !== null) frag.appendChild(made); });
      return frag;
    }
    var el = document.createElement(node.type);
    var props = node.props || {};
    Object.keys(props).forEach(function (key) {
      var value = props[key];
      // React drops `false` attributes (`disabled={false}` renders nothing);
      // setAttribute would stringify it to "false" and disable the button.
      if (key === 'children' || value === undefined || value === null || value === false) return;
      if (key === 'className') el.className = value;
      else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
      else if (key === 'value' && node.type === 'select') el.value = String(value);
      else if (key.slice(0, 2) === 'on' && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value);
      else el.setAttribute(key, String(value));
    });
    var kids = mount(props.children);
    if (kids !== null) el.appendChild(kids);
    return el;
  }

  var client = captured.factory(function (id) {
    if (id === 'react') return React;
    if (id === 'react/jsx-runtime') return jsxRuntime;
    throw new Error('unexpected require: ' + id);
  });

  /* The plugin injects this stylesheet inside apply(); the preview mounts the
     same component without a Cordis context, so it injects the same CSS here —
     otherwise the button would be measured and photographed unstyled. */
  var sheet = document.createElement('style');
  sheet.id = 'dsh-po-css';
  sheet.textContent = client.CSS;
  document.head.appendChild(sheet);

  /* The composer's standard props, stubbed: a non-empty draft and a no-op writer. */
  var composerProps = {
    useInput: function () { return '写一个能把目录里图片压到 500KB 以内的脚本'; },
    inputActions: { setDraft: function () {} },
    t: undefined,
  };

  function cell(host, caption, plan, decorate) {
    var box = document.createElement('div');
    box.className = 'cell';
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = caption;
    box.appendChild(cap);

    /* The REAL exported slot entry, rendered through the stub hooks. */
    statePlan = plan;
    stateCursor = 0;
    var element = client.HardForgeEntry(composerProps);
    var tree = element.type(element.props);
    var dom = mount(tree);
    statePlan = null;
    if (typeof decorate === 'function') decorate(dom);
    box.appendChild(dom);
    host.appendChild(box);
    return box;
  }

  function build(host) {
    ['idle', 'busy', 'done', 'error'].forEach(function (phase) {
      cell(host, phase, null, function (dom) {
        /* One static render cannot advance the hook state, so the phase attribute
           the component itself sets is applied here to show every state's skin. */
        var btn = dom.querySelector('.dshPo_btn');
        btn.setAttribute('data-phase', phase);
        if (phase === 'done' || phase === 'error') {
          var note = document.createElement('span');
          note.className = 'dshPo_note';
          note.setAttribute('data-phase', phase);
          note.textContent = phase === 'done' ? '已锻造 · 模型出手' : '连不上宿主，锻造炉没点着火';
          dom.appendChild(note);
        }
      });
    });

  }

  /* The picker, opened: model row + two chip rows in its own band so the
     absolutely-positioned panel has room and is not clipped by the layout. */
  function buildMenu(host) {
    cell(
      host,
      'menu · open',
      [
        'idle',
        '',
        true,
        'hard',
        'native',
        [{ id: 'low', name: 'Low' }, { id: 'high', name: 'High' }, { id: 'max', name: 'Max' }],
        'max',
        [
          { provider: 'deepseek-account', providerName: 'DeepSeek 账号', model: 'deepseek-v4.1-flash', name: 'DeepSeek-V4.1-Flash' },
          { provider: 'deepseek-account', providerName: 'DeepSeek 账号', model: 'deepseek-v4-pro', name: 'DeepSeek-V4-Pro' },
          { provider: 'happycoding', providerName: 'happycoding', model: 'deepseek-v4.1-flash', name: 'deepseek-v4.1-flash' },
        ],
        { provider: 'deepseek-account', model: 'deepseek-v4.1-flash', manual: false },
        null,
        'model',
      ],
      null,
    );
  }

  build(document.getElementById('light'));
  build(document.getElementById('dark'));
  buildMenu(document.getElementById('menu-dark'));

  // Machine-readable proof for a headless DOM dump: real engine, real CSS.
  var probe = document.createElement('pre');
  probe.id = 'dsh-po-probe';
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.dshPo_btn'));
  var first = buttons[0];
  var firstLabel = first.querySelector('.dshPo_label');
  var btnStyle = getComputedStyle(first);
  var labelStyle = getComputedStyle(firstLabel);
  var ringStyle = getComputedStyle(first, '::after');
  probe.textContent = JSON.stringify({
    buttons: buttons.map(function (b) {
      return b.getAttribute('data-phase') + '=' + b.textContent;
    }),
    backgroundImage: btnStyle.backgroundImage,
    backgroundClip: btnStyle.backgroundClip,
    surfaceToken: btnStyle.getPropertyValue('--dshPo-surface').trim(),
    labelBackgroundClip: labelStyle.webkitBackgroundClip || labelStyle.backgroundClip,
    labelTextFill: labelStyle.webkitTextFillColor,
    glow: btnStyle.boxShadow,
  }, null, 2);
  document.body.appendChild(probe);
})();
</script>
</body>
</html>
